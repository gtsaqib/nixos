'$schema' = 'https://starship.rs/config-schema.json'

add_newline = false
command_timeout = 1000

format = '''
[╭$os( $git_branch$git_commit(\($git_status$git_metrics\) )$git_state)$docker_context$package$bun$c$cmake$cobol$cpp$dart$deno$dotnet$elixir$elm$erlang$fennel$fortran$gleam$golang$gradle$haskell$haxe$helm$java$julia$kotlin$lua$maven$mojo$nim$nodejs$ocaml$odin$opa$perl$php$pulumi$purescript$python$quarto$raku$rlang$red$ruby$rust$scala$solidity$swift$terraform$typst$vlang$vagrant$xmake$zig$buf$guix_shell$nix_shell$conda$pixi$meson$spack$aws$gcloud$openstack$azure$direnv$mise$crystal$fill$battery$status$cmd_duration$time
╰$directory$jobs$character](cyan dimmed)
'''

[os]
disabled = false
style = 'bold cyan dimmed'
format = '[$symbol]($style)'

[os.symbols]
NixOS = ' '

[git_branch]
symbol = ' '
style = 'bold purple'
format = '[$symbol$branch(:$remote_branch)]($style) '

[git_commit]
tag_disabled = false
tag_symbol = '  '
style = 'bold green'
format = ' [$hash[$tag](green)]($style) '

[git_status]
ahead = '[ ${count}](bold green)'
behind = '[ ${count}](bold red)'
diverged = '[󰹹 ](dimmed)[${ahead_count}](bold green)/[${behind_count}](bold red)'
style = 'bold yellow'
format = '([$all_status]($style)( · $ahead_behind) · )'

[git_metrics]
disabled = false
only_nonzero_diffs = false
added_style = 'bold green'
deleted_style = 'bold red'
format = '[ ](dimmed)[[$added]($added_style)/[$deleted]($deleted_style)](cyan dimmed)'

[git_state]
rebase = '󰜘 rebasing'
merge = '󰓂 merging'
revert = '󰕍 reverting'
cherry_pick = ' cherry-picking'
bisect = '󰦀 bisecting'
am = '󰶈 applying'
am_or_rebase = '󰜘 applying / rebasing'
format = '[$state](bold yellow)( · [$progress_current](yellow)/[$progress_total](yellow)) '

[docker_context]
symbol = ' '
style = 'bold blue'
format = ' [$symbol$context]($style) '

[package]
symbol = '󰏗 '
style = 'bold yellow'
format = ' [$symbol$version]($style) '

[bun]
symbol = ' '
style = 'bold red'
format = ' [$symbol$version]($style) '

[c]
symbol = ' '
style = 'bold green'
format = ' [$symbol($version(-$name) )]($style)'

[cmake]
symbol = ' '
style = 'bold blue'
format = ' [$symbol($version )]($style)'

